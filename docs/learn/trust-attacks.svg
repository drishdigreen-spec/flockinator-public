<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320"><rect width="920" height="320" fill="#0b1020"/><text x="460" y="34" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle">Same message, three meanings</text><g font-family="sans-serif" font-size="16"><rect x="50" y="95" width="250" height="120" rx="12" fill="#14532d"/><text x="175" y="135" fill="#fff" text-anchor="middle">Trusted</text><text x="175" y="165" fill="#d1fae5" text-anchor="middle">Signed, fresh,</text><text x="175" y="190" fill="#d1fae5" text-anchor="middle">independently confirmed</text><rect x="335" y="95" width="250" height="120" rx="12" fill="#713f12"/><text x="460" y="135" fill="#fff" text-anchor="middle">Sceptical</text><text x="460" y="165" fill="#fef3c7" text-anchor="middle">Signed, but only</text><text x="460" y="190" fill="#fef3c7" text-anchor="middle">one source so far</text><rect x="620" y="95" width="250" height="120" rx="12" fill="#7f1d1d"/><text x="745" y="135" fill="#fff" text-anchor="middle">Attack</text><text x="745" y="165" fill="#fee2e2" text-anchor="middle">Forged, replayed,</text><text x="745" y="190" fill="#fee2e2" text-anchor="middle">or copied as fake proof</text></g><text x="460" y="265" fill="#bcd" font-family="sans-serif" font-size="17" text-anchor="middle">Flockinator tests whether the swarm can tell them apart in time.</text></svg>
