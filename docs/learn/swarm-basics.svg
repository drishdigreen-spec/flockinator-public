<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300"><rect width="920" height="300" fill="#0b1020"/><text x="460" y="34" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle">One bird is simple. A flock is not.</text><g fill="#57c7ff"><circle cx="150" cy="150" r="16"/><circle cx="230" cy="110" r="16"/><circle cx="230" cy="190" r="16"/><circle cx="310" cy="150" r="16"/></g><text x="230" y="250" fill="#bcd" font-family="sans-serif" font-size="16" text-anchor="middle">Each node follows local rules</text><text x="460" y="150" fill="#fff" font-family="sans-serif" font-size="30" text-anchor="middle">+</text><g fill="#ffd257"><circle cx="610" cy="110" r="13"/><circle cx="660" cy="150" r="13"/><circle cx="610" cy="190" r="13"/><circle cx="710" cy="110" r="13"/><circle cx="710" cy="190" r="13"/><circle cx="760" cy="150" r="13"/></g><text x="685" y="250" fill="#bcd" font-family="sans-serif" font-size="16" text-anchor="middle">Together: patterns no node planned</text></svg>
