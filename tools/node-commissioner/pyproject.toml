[project]
name = "flockinator-node-commissioner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyserial==3.5"]
[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["node_commissioner"]
