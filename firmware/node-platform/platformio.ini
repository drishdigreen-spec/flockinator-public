[platformio]
default_envs = waveshare-s3
build_dir = ${sysenv.HOME}/.cache/flockinator-node-platform/build
libdeps_dir = ${sysenv.HOME}/.cache/flockinator-node-platform/libdeps

[env]
extra_scripts = pre:scripts/appledouble.py

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra -Werror

[env:waveshare-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = waveshare-n32r16
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600

; Recovery-test image only. Never flash this environment over USB.
[env:rollback-test]
extends = env:waveshare-s3
build_flags = -DFLOCK_TEST_REJECT_BOOT=1

; Actual Patternflow Origin preset on the commissioned node platform.
[env:patternflow-trial]
extends = env:waveshare-s3
build_flags = -DFLOCK_PATTERNFLOW_TRIAL=1

[env:journal-trial]
extends = env:waveshare-s3
build_flags = -DFLOCK_MISSION_JOURNAL=1
